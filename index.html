</style></head><body><header><div class="brand">SUPER MARIO<span style="color:#ffdc62"> / </span>FRAZIONI<small>LA GRANDE FUGA DAL REGNO</small></div><nav class="tools" aria-label="Strumenti"><button class="quiet" id="map">Mappa</button><button class="quiet" id="sound" aria-pressed="false">Suoni: spenti</button><button class="quiet" id="reset">Ricomincia</button></nav></header><main id="app"></main><section class="diploma" id="diploma"></section><script>
'use strict';
const KEY='fraction-escape-v1';
const rooms=[{title:'Il regno delle frazioni',place:'PRATERIA SMERALDO',desc:'Tra funghi giganti e blocchi misteriosi, la prima stella aspetta chi sa leggere le parti di un intero.',color:'#1c877d',sky:'#143e68',count:4},{title:'La caverna delle equivalenze',place:'GROTTE DI AMETISTA',desc:'Due frazioni, la stessa quantità. Riaccendi i cristalli e ricostruisci il ponte sospeso.',color:'#443883',sky:'#161535',count:4},{title:'Il castello delle tre frazioni',place:'FORTEZZA DEI FANTASMI',desc:'Tre porte custodiscono tre famiglie. Trova un posto per ogni frazione e sciogli l’incantesimo.',color:'#503e7f',sky:'#221936',count:4},{title:'Il ponte di lava',place:'VULCANO SCARLATTO',desc:'Una piattaforma per ogni scoperta. Confronta le frazioni e costruisci un passaggio sopra la lava.',color:'#9b3c32',sky:'#391d35',count:4},{title:'La sfida finale di Bowser',place:'LA SALA DEL TRONO',desc:'Cinque sigilli, cinque cifre. La matematica è la chiave della porta blindata.',color:'#8c293e',sky:'#260f26',count:5}];
const fresh=()=>({name:'',avatar:0,steps:[0,0,0,0,0],stars:0,coins:0,room:0,sound:false,code:[],errors:{},hints:{}});
let state=fresh(),storageOK=true;try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.name==='string'&&Array.isArray(s.steps)&&s.steps.length===5&&s.steps.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=rooms[i].count)&&Number.isInteger(s.stars)&&s.stars>=0&&s.stars<=5){state={...fresh(),...s};state.name=state.name.slice(0,30);state.room=Math.min(4,Math.max(0,Number(s.room)||0));state.avatar=[0,1,2].includes(s.avatar)?s.avatar:0;state.coins=state.steps.reduce((a,b)=>a+b,0)*10;state.errors=s.errors||{};state.hints=s.hints||{};state.code=(s.code||[]).slice(0,5)}}catch(e){storageOK=false}
for(let i=0;i<4;i++){if(state.steps[i]===rooms[i].count)state.stars=Math.max(state.stars,i+1);else break}
let view=state.name?'map':'intro',selected=null,paint=new Set(),order=[],pair=[],opened=new Set(),rewardRoom=0,audio;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}}
function star(){return '<svg viewBox="0 0 100 100" role="img" aria-label="Stella magica"><path fill="#ffdc62" stroke="#fff0ad" stroke-width="3" d="M50 5 64 34 96 39 73 62 79 94 50 79 21 94 27 62 4 39 36 34Z"/><ellipse cx="40" cy="52" rx="4" ry="8" fill="#65422c"/><ellipse cx="60" cy="52" rx="4" ry="8" fill="#65422c"/></svg>'}
function hero(avatar=state.avatar){const c=['#f35d57','#4bc69a','#a58af5'][avatar];return `<svg viewBox="0 0 420 400" role="img" aria-label="Esploratore del Regno dei Funghi"><ellipse cx="218" cy="368" rx="115" ry="18" fill="#06192b55"/><path d="M120 365 136 300 190 300 186 365Z M230 365 221 300 273 300 294 365Z" fill="#293c6b" stroke="#102c47" stroke-width="8"/><path d="M122 170Q207 120 282 181L297 294Q210 333 121 294Z" fill="${c}" stroke="#142c4a" stroke-width="7"/><path d="M156 183V280H250V185M173 200V286M236 200V286" fill="#315c96" stroke="#153a63" stroke-width="10"/><circle cx="174" cy="239" r="7" fill="#ffdc62"/><circle cx="236" cy="239" r="7" fill="#ffdc62"/><path d="M120 198 72 252 98 277 143 241M283 197 326 235 351 210 308 163" fill="${c}" stroke="#142c4a" stroke-width="8"/><circle cx="82" cy="266" r="24" fill="#fff4d9"/><circle cx="342" cy="208" r="24" fill="#fff4d9"/><ellipse cx="207" cy="123" rx="68" ry="72" fill="#ffd3a1" stroke="#6b423c" stroke-width="7"/><path d="M135 116Q116 27 199 27Q274 14 280 93L304 105Q236 127 135 116" fill="${c}" stroke="#142c4a" stroke-width="7"/><circle cx="207" cy="68" r="23" fill="#fff4dd"/><path d="m197 78 10-24 10 24" fill="none" stroke="${c}" stroke-width="7"/><ellipse cx="183" cy="134" rx="7" ry="12" fill="#24334e"/><ellipse cx="234" cy="134" rx="7" ry="12" fill="#24334e"/><ellipse cx="210" cy="153" rx="19" ry="14" fill="#f2b481"/><path d="M178 167Q207 191 238 167" fill="none" stroke="#633f39" stroke-width="8" stroke-linecap="round"/><path d="M120 361H190V381H108Q99 369 120 361M238 361H287L308 381H231Z" fill="#633e41" stroke="#182b44" stroke-width="6"/></svg>`}
function scenery(r){let o=rooms[r],decor='';if(r===0){decor='<circle cx="1030" cy="125" r="70" fill="#ffe38a"/><path d="M0 550Q180 250 400 560Q660 250 880 550Q1100 300 1400 520V900H0" fill="#318d80"/><path d="M0 650Q250 460 510 640Q820 440 1120 630L1400 550V900H0" fill="#17685e"/>';for(let i=0;i<6;i++){let x=80+i*270,y=620+(i%2)*70;decor+=`<g transform="translate(${x} ${y})"><path d="M-17 0H17L24 110H-24Z" fill="#fbe0ac"/><path d="M-80 0Q-65-135 0-123Q65-135 80 0Z" fill="${i%2?'#ffbd55':'#e86568'}"/><circle cx="-35" cy="-36" r="17" fill="#fff1d1"/><circle cx="24" cy="-72" r="19" fill="#fff1d1"/></g>`}decor+='<path d="M1090 695V555H1190V695M1070 555H1210V520H1070Z" fill="#42b67a" stroke="#123e48" stroke-width="8"/>'}else if(r===1){decor='<path d="M0 0H1400V100L1200 70 1110 240 1020 60 860 90 720 290 650 65 450 110 330 230 250 60 0 170Z" fill="#302b59"/>';for(let i=0;i<12;i++){let x=i*130;decor+=`<path d="M${x} 850l-30-100 28-115 40 100-8 115Z" fill="${i%2?'#6969d7':'#45aebc'}" stroke="#b4b1ff" stroke-width="3"/>`}decor+='<path d="M150 650 360 620M500 570 700 560M830 640 1060 620" stroke="#666887" stroke-width="25"/>'}else {decor='<path d="M0 0H1400V900H0Z" fill="url(#bricks'+r+')"/>';for(let i=0;i<5;i++){let x=60+i*300;decor+=`<path d="M${x} 670V220Q${x+75} 80 ${x+150} 220V670Z" fill="#100f2bcc" stroke="#aa719050" stroke-width="12"/><path d="M${x+20} 650V250Q${x+75} 135 ${x+130} 250V650Z" fill="${r===2?'#7765aa33':'#e9613333'}"/>`}if(r===2){for(let i=0;i<4;i++)decor+=`<g transform="translate(${180+i*340},${320+i%2*150})"><path d="M-40 35V0a40 40 0 0 1 80 0v35l-15-12-15 12-15-12-15 12-20-12Z" fill="#d5d4ff99"/><ellipse cx="-13" cy="-3" rx="5" ry="10" fill="#352d5f"/><ellipse cx="13" cy="-3" rx="5" ry="10" fill="#352d5f"/></g>`}else decor+='<path d="M0 750Q180 690 350 760T700 750T1050 760T1400 740V900H0Z" fill="#ed6a35"/><path d="M0 790Q200 720 400 790T800 790T1200 790T1600 790" fill="none" stroke="#ffc45a" stroke-width="20"/>'}if(r===3)decor='<path d="M0 700 230 240 430 660 740 170 1060 690 1250 350 1400 700V900H0Z" fill="#522d42"/><path d="m230 240-45 85 45-20 45 20Z M740 170l-60 110 60-25 60 25Z" fill="#ffb35a"/><path d="M0 770Q175 700 350 770T700 770T1050 770T1400 770V900H0Z" fill="#f16b36"/><path d="M0 810Q175 750 350 810T700 810T1050 810T1400 810" fill="none" stroke="#ffce69" stroke-width="18"/><path d="M90 655H300M420 610H610M750 590H940M1060 640H1280" stroke="#9a8490" stroke-width="35"/>';return `<svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky${r}" x2="0" y2="1"><stop stop-color="${o.sky}"/><stop offset="1" stop-color="${o.color}"/></linearGradient><pattern id="bricks${r}" width="140" height="80" patternUnits="userSpaceOnUse"><path d="M0 0H140V80H0ZM70 0V40M0 40H140M35 40V80M105 40V80" stroke="#bf899522" stroke-width="3" fill="none"/></pattern></defs><path fill="url(#sky${r})" d="M0 0H1400V900H0Z"/>${decor}<path d="M0 900V830H1400V900" fill="#101b2e88"/></svg>`}
function bars(n,d){let rect='';for(let i=0;i<d;i++)rect+=`<rect x="${i*200/d+2}" y="5" width="${200/d-4}" height="50" rx="3" fill="${i<n?'#ffdc62':'#334a6c'}" stroke="#daeaff" stroke-width="1.5"/>`;return `<svg viewBox="0 0 204 60" role="img" aria-label="${n} parti colorate su ${d} parti uguali">${rect}</svg>`}
const frac=s=>{let [n,d]=s.split('/');return `<span class="fraction" aria-label="${n} su ${d}"><b>${n}</b><i>${d}</i></span>`};
function tile(v,label=v){return `<button class="tile" data-answer="${esc(v)}">${label.includes('/')?frac(label):label}</button>`}
function tone(good=true){if(!state.sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();[0,1,2].forEach((v)=>{let osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.value=(good?440:180)*[1,1.25,1.5][v];gain.gain.setValueAtTime(.06,audio.currentTime+v*.09);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+v*.09+.16);osc.connect(gain).connect(audio.destination);osc.start(audio.currentTime+v*.09);osc.stop(audio.currentTime+v*.09+.17)})}catch(e){$('#sound').textContent='Audio non disponibile'}}
function shell(r,html){return `<section class="screen"><div class="landscape">${scenery(r)}</div><div class="content">${html}<footer class="signed">Progetto didattico – Prof.ssa Maria Grazia Bianco | 2026<br>${storageOK?'Progressi salvati su questo dispositivo.':'Salvataggio non disponibile: mantieni aperta questa pagina.'}</footer></div></section>`}
function render(){selected=null;paint.clear();order=[];pair=[];opened.clear();$('#sound').textContent=state.sound?'Suoni: attivi':'Suoni: spenti';$('#sound').setAttribute('aria-pressed',state.sound);$('#map').disabled=!state.name;
if(view==='intro'){$('#app').innerHTML=shell(0,`<div class="hero"><div><span class="badge">5 mondi · 5 stelle · una grande avventura</span><h1>La grande fuga<br>dal <em>Regno delle<br>Frazioni.</em></h1><p class="intro">Bowser ha rubato le cinque stelle e sigillato il regno. Mario cerca un alleato: esplora, muovi gli oggetti e usa le frazioni per riaprire le porte.</p><div class="setup"><label>Il tuo nome<br><input id="name" maxlength="30" placeholder="Nome o soprannome" autocomplete="off"></label><div><div style="margin-bottom:8px">Scegli l’esploratore</div><div class="avatars">${[0,1,2].map(i=>`<button class="avatar" data-avatar="${i}" aria-label="Esploratore ${i+1}" aria-pressed="${state.avatar===i}">${hero(i)}</button>`).join('')}</div></div></div><button id="start" class="primary">INIZIA L’AVVENTURA!</button><div class="meta"><span>35–45 minuti, senza fretta</span><span>Trascina oppure seleziona e clicca</span></div></div><div class="avatar-art">${hero()}</div></div>`);$('#start').onclick=()=>{state.name=$('#name').value.trim()||'Esploratore';save();view='map';render()};document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{state.avatar=Number(b.dataset.avatar);document.querySelectorAll('[data-avatar]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('.avatar-art').innerHTML=hero()});return}

function task(){return tasks[state.room][state.steps[state.room]]}function taskKey(){return state.room+'-'+state.steps[state.room]}
function artFraction(n,d){let parts='';let remaining=n;for(let i=0;i<Math.ceil(n/d);i++){parts+=bars(Math.min(remaining,d),d);remaining-=d}return parts}

$('#speak').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(locked?'Inserisci le cinque cifre del codice finale.':t.q);u.lang='it-IT';u.rate=.85;speechSynthesis.speak(u)}else feedback('La lettura vocale non è disponibile in questo browser.',false)};$('#help').onclick=showHint;$('#retry').onclick=()=>render();if(locked){$('#unlock').onclick=()=>{if($('#code').value===finalCode().join('')){state.stars=5;save();tone();rewardRoom=4;view='reward';render()}else wrong('Controlla l’ordine delle cinque cifre mostrate sopra la serratura.')};return}bindPuzzle(t);if(state.hints[taskKey()])showHint(false)}

function puzzle(t){let h=`<p class="task" id="instruction">${t.q}</p>`;const visual=`<div class="visual">${artFraction(t.n,t.d)}${t.n2?bars(t.n2,t.d2):''}</div>`;

case'labels':return h+`<div class="tiles">${['NUMERATORE','DENOMINATORE'].map(v=>`<button draggable="true" class="tile movable" data-item="${v}">${v}</button>`).join('')}</div><div class="visual"><button class="tile target" data-target="NUMERATORE" aria-label="Posizione sopra la linea">3 · sopra la linea</button><hr><button class="tile target" data-target="DENOMINATORE" aria-label="Posizione sotto la linea">8 · sotto la linea</button></div><p class="muted">Trascina una parola oppure selezionala e tocca la posizione.</p>`;

case'classify':case'classifyAll':{let vals=t.type==='classify'?[t.value]:['3/7','9/4','12/4'];return h+`<div class="tiles" id="pieces">${vals.map(v=>`<button class="tile movable" draggable="true" data-item="${v}">${frac(v)}${artFraction(...v.split('/').map(Number))}</button>`).join('')}</div><div class="tiles" style="margin-top:20px">${['proprie','improprie','apparenti'].map(v=>`<button class="door target" data-target="${v}">${v}<small>${v==='proprie'?'meno di un intero':v==='improprie'?'più di un intero*':'uno o più interi'}</small></button>`).join('')}</div><p class="muted">Seleziona una tessera e tocca la porta, oppure trascinala.${t.type==='classifyAll'?'':' '}<br>*Qui usiamo “improprie” per quelle non apparenti.</p>`}
case'choice':return h+visual+`<div class="answers">${t.options.map(v=>tile(v)).join('')}</div>`;

case'order':return h+`<div class="tiles">${['6/7','1/7','3/7'].map(v=>`<button class="tile movable" draggable="true" data-item="${v}">${frac(v)}${bars(+v[0],7)}</button>`).join('')}</div><div class="tiles" style="margin-top:20px">${[0,1,2].map(i=>`<button class="tile target" data-target="${i}" aria-label="Piattaforma ${i+1}">${i+1} · vuota</button>`).join('')}</div><div class="answers"><button id="check" class="primary">Attraversa il ponte</button></div><p class="muted">Seleziona una tessera e una piattaforma, oppure trascina. Puoi sostituire le tessere.</p>`}

function equivalence(){return `<div class="equivalence" id="equiv"><span>${frac('1/2')}</span><span>× 2<br>↔<br>÷ 2</span><span>${frac('2/4')}</span><button class="quiet" id="animate">Mostra la trasformazione</button></div>`}

function finalCode(){const t=tasks[4];return [t[0].n,t[1].n*(6/t[1].d),t[2].n/t[2].d,Math.max(t[3].n,t[3].n2),t[4].d-t[4].n]}

function wrong(msg){let k=taskKey();state.errors[k]=(state.errors[k]||0)+1;save();tone(false);feedback('Riprova: '+msg,false);$('.panel').classList.remove('shake');void $('.panel').offsetWidth;$('.panel').classList.add('shake');if(state.errors[k]>=2)showHint(false);if(state.errors[k]>=3)showHint(true)}
function showHint(advance=true){let k=taskKey(),level=state.hints[k]||0;if(advance)level=Math.min(level+1,2);else level=Math.max(level,1);state.hints[k]=level;save();let t=task();$('#hint').innerHTML=`<div class="hint"><strong>${level===2?'Aiuto guidato':'Indizio visivo'}</strong><br>${t?t.hint:'Leggi da sinistra a destra le cinque cifre dei sigilli.'}${t&&t.n?artFraction(t.n,t.d):bars(1,2)}${level===2&&t?.answer?'<p>Obiettivo da ricostruire: '+esc(t.answer)+'</p>':''}</div>`}
function success(){let r=state.room,s=state.steps[r],t=task();if(!t||$('#continue'))return;state.steps[r]++;state.coins+=10;if(r<4&&state.steps[r]===rooms[r].count)state.stars=Math.max(state.stars,r+1);if(r===4)state.code[s]=finalCode()[s];save();tone();feedback('Meccanismo attivato! +10 monete'+(r===4?' · Cifra conquistata: '+state.code[s]:''),true);document.querySelectorAll('.panel button,.panel input').forEach(b=>b.disabled=true);let b=document.createElement('button');b.id='continue';b.className='primary';b.style.marginTop='20px';b.textContent=r===4?'Prosegui verso la serratura':state.steps[r]===rooms[r].count?'Recupera la stella':'Esplora il prossimo meccanismo';$('.panel').append(b);b.focus();b.onclick=()=>{if(state.steps[r]===rooms[r].count&&r!==4){state.stars=Math.max(state.stars,r+1);rewardRoom=r;view='reward';save()}render()}}
$('#map').onclick=()=>{view='map';render()};$('#sound').onclick=()=>{state.sound=!state.sound;save();$('#sound').textContent=state.sound?'Suoni: attivi':'Suoni: spenti';$('#sound').setAttribute('aria-pressed',state.sound);if(state.sound)tone()};$('#reset').onclick=()=>{let div=document.createElement('div');div.className='reset-box';div.innerHTML='<section class="panel" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">Ricominciare il viaggio?</h2><p>Le stelle e le monete salvate su questo dispositivo saranno azzerate.</p><div class="answers"><button class="quiet" id="cancel">Continua a giocare</button><button class="primary" id="confirm">Ricomincia da zero</button></div></section>';document.body.append(div);$('#cancel').focus();$('#cancel').onclick=()=>div.remove();$('#confirm').onclick=()=>{state=fresh();save();div.remove();view='intro';render()};div.onkeydown=e=>{if(e.key==='Escape')div.remove();if(e.key==='Tab'){e.preventDefault();(document.activeElement===$('#cancel')?$('#confirm'):$('#cancel')).focus()}}};
render();
</script></body></html>
